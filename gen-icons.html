<!DOCTYPE html>
<html>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function draw(size) {
  canvas.width = size; canvas.height = size;
  const r = size * 0.18;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(size-r, 0);
  ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r);
  ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size);
  ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r);
  ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0,0,size,size);
  grad.addColorStop(0,'#6366f1');
  grad.addColorStop(1,'#8b5cf6');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${size*0.5}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✓', size/2, size/2 + size*0.04);
}

draw(192);
const a192 = document.createElement('a');
a192.download = 'icon-192.png';
a192.href = canvas.toDataURL('image/png');
a192.textContent = '下載 192px';
document.body.appendChild(a192);

draw(512);
const a512 = document.createElement('a');
a512.download = 'icon-512.png';
a512.href = canvas.toDataURL('image/png');
a512.textContent = ' | 下載 512px';
document.body.appendChild(a512);
</script>
</body>
</html>
